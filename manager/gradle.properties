org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 引导桩（assets/xp/stub.dex）构建链开关：有 JDK javac + Android SDK d8 时，
# assembleRelease 会先编译 manager/stub 再生成 dex；工具链缺失时打印警告并沿用已入库的 dex。
# 关掉它（false）就完全回到手工维护 stub.dex 的方式。
xp.stub.autoBuild=true
# verifyStubDex 发现 stub.dex 与源码不一致时是否让 check 失败；默认只提示。
xp.stub.verifyStrict=false
