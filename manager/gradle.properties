org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 引导桩（assets/xp/stub.dex）构建链开关：有 JDK javac + Android SDK d8 时，
# assembleRelease 会先编译 manager/stub 再生成 dex。
# 工具链缺失（找不到 javac / d8 / android.jar）只打印警告并沿用已入库的 dex；
# 但工具链齐全后 javac/d8 失败会让构建直接失败——陈旧 stub.dex 会让 entryHook 产物
# 在目标机启动即 ClassNotFoundException，这种包不该被构建出来（审查 S-P1-2）。
# 关掉它（false）就完全回到手工维护 stub.dex 的方式。
xp.stub.autoBuild=true
# d8 的 --min-api，必须与 app 的 minSdk 一致（29 = Android 10，见 README 的兼容性声明）。
xp.stub.minApi=29
# verifyStubDex 发现 stub.dex 与源码不一致（哈希、源码摘要或 dex 里缺桩类）时是否让构建失败。
# 默认 true：该任务已挂到 check 与 assembleRelease，不一致就别发版。
xp.stub.verifyStrict=true
# 版本门禁 checkRuntimeVersion（同样挂在 check 与 assembleRelease）没有开关：
# 它断言 ApkPatcher.RUNTIME_VERSION 与内核 CoreEntry.RUNTIME_VERSION 相同，
# 升级内核版本必须同时改这两处常量，否则构建失败。
